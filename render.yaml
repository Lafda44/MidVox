services:
  - type: web
    name: midvox-bot
    env: python
    buildCommand: pip install -r bot/requirements.txt
    startCommand: cd bot && python CodeX.py
    envVars:
      - key: TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: API_ENABLED
        value: "true"
      - key: API_PORT
        value: "8000"
      - key: DASHBOARD_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: TUNNEL_ENABLED
        value: "false"

  - type: web
    name: midvox-dashboard
    env: node
    buildCommand: cd dashboard && npm install && npm run build
    startCommand: cd dashboard && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DASHBOARD_API_KEY
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_ADMIN_IDS
        sync: false
      - key: NEXT_PUBLIC_BRAND_NAME
        value: "MidVox"
      - key: NEXT_PUBLIC_BRAND_NAME_WORD
        value: "MV"