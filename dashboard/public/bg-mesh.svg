<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-lg" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(99,102,241,0.08)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-sm" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(99,102,241,0.04)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="m1" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2" cx="20%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m3" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="gblur">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>
  <rect width="1440" height="810" fill="#050510"/>
  <rect width="1440" height="810" fill="url(#grid-sm)"/>
  <rect width="1440" height="810" fill="url(#grid-lg)"/>
  <!-- Glows -->
  <ellipse cx="720" cy="0" rx="600" ry="300" fill="url(#m1)" filter="url(#gblur)" opacity="1"/>
  <ellipse cx="288" cy="486" rx="400" ry="250" fill="url(#m2)" filter="url(#gblur)" opacity="1"/>
  <ellipse cx="1152" cy="648" rx="380" ry="220" fill="url(#m3)" filter="url(#gblur)" opacity="1"/>
  <!-- Intersection dots at grid vertices -->
  <g fill="rgba(99,102,241,0.15)">
    <circle cx="64" cy="64" r="1.5"/>
    <circle cx="128" cy="64" r="1"/>
    <circle cx="192" cy="64" r="1.5"/>
    <circle cx="64" cy="128" r="1"/>
    <circle cx="128" cy="128" r="2"/>
    <circle cx="256" cy="128" r="1.5"/>
    <circle cx="320" cy="64" r="1"/>
    <circle cx="384" cy="128" r="1.5"/>
    <circle cx="448" cy="64" r="1"/>
    <circle cx="512" cy="128" r="2"/>
    <circle cx="576" cy="64" r="1"/>
    <circle cx="640" cy="128" r="1.5"/>
    <circle cx="704" cy="64" r="1"/>
    <circle cx="768" cy="128" r="2"/>
    <circle cx="832" cy="64" r="1"/>
    <circle cx="896" cy="128" r="1.5"/>
    <circle cx="960" cy="64" r="1"/>
    <circle cx="1024" cy="128" r="2"/>
    <circle cx="1088" cy="64" r="1.5"/>
    <circle cx="1152" cy="128" r="1"/>
    <circle cx="1216" cy="64" r="1.5"/>
    <circle cx="1280" cy="128" r="1"/>
    <circle cx="1344" cy="64" r="2"/>
    <circle cx="1408" cy="128" r="1.5"/>
  </g>
  <!-- Vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#050510" stop-opacity="0"/>
    <stop offset="100%" stop-color="#050510" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1440" height="810" fill="url(#vig)"/>
</svg>