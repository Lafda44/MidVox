<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="r1" cx="28%" cy="35%" r="55%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="72%" cy="28%" r="48%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r3" cx="55%" cy="65%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r4" cx="10%" cy="80%" r="40%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r5" cx="90%" cy="70%" r="35%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1440" height="810" fill="#040409"/>
  <!-- Star field -->
  <g opacity="0.35">
    <circle cx="120" cy="80" r="1" fill="#ffffff"/>
    <circle cx="280" cy="45" r="0.7" fill="#ffffff"/>
    <circle cx="450" cy="120" r="1.2" fill="#ffffff"/>
    <circle cx="620" cy="55" r="0.8" fill="#ffffff"/>
    <circle cx="810" cy="90" r="1" fill="#ffffff"/>
    <circle cx="980" cy="30" r="0.6" fill="#ffffff"/>
    <circle cx="1150" cy="70" r="1.1" fill="#ffffff"/>
    <circle cx="1320" cy="45" r="0.8" fill="#ffffff"/>
    <circle cx="180" cy="160" r="0.5" fill="#a5b4fc"/>
    <circle cx="380" cy="200" r="0.9" fill="#c7d2fe"/>
    <circle cx="680" cy="175" r="0.7" fill="#ffffff"/>
    <circle cx="900" cy="140" r="1" fill="#c4b5fd"/>
    <circle cx="1100" cy="190" r="0.6" fill="#ffffff"/>
    <circle cx="1400" cy="120" r="0.8" fill="#ffffff"/>
    <circle cx="60" cy="250" r="0.7" fill="#ffffff"/>
    <circle cx="240" cy="300" r="1.1" fill="#bfdbfe"/>
    <circle cx="520" cy="280" r="0.5" fill="#ffffff"/>
    <circle cx="760" cy="250" r="0.9" fill="#ffffff"/>
    <circle cx="1050" cy="270" r="0.6" fill="#ddd6fe"/>
    <circle cx="1250" cy="240" r="1" fill="#ffffff"/>
  </g>
  <!-- Aurora layers -->
  <ellipse cx="403" cy="283" rx="520" ry="320" fill="url(#r1)" filter="url(#blur3)" opacity="0.85"/>
  <ellipse cx="1037" cy="227" rx="460" ry="280" fill="url(#r2)" filter="url(#blur3)" opacity="0.8"/>
  <ellipse cx="792" cy="527" rx="480" ry="260" fill="url(#r3)" filter="url(#blur2)" opacity="0.7"/>
  <ellipse cx="144" cy="648" rx="360" ry="220" fill="url(#r4)" filter="url(#blur2)" opacity="0.65"/>
  <ellipse cx="1296" cy="567" rx="340" ry="200" fill="url(#r5)" filter="url(#blur1)" opacity="0.6"/>
  <!-- Subtle horizontal aurora band -->
  <rect x="0" y="280" width="1440" height="180" fill="url(#r1)" opacity="0.12" filter="url(#blur3)"/>
  <!-- Vignette overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#040409" stop-opacity="0"/>
    <stop offset="100%" stop-color="#040409" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1440" height="810" fill="url(#vignette)"/>
</svg>